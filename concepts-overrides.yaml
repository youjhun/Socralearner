# 지식 그래프 손보기 — **지도만 고친다. 기록은 그대로 둔다.**
#
# 지식 그래프의 노드는 어디에도 따로 저장돼 있지 않다. 매 빌드마다 daily 세션 노트의
# `## 개념 지도` 절에서 다시 만들어진다. 그래서 "이 노드 지워줘"를 문자 그대로 하려면
# 과거 세션 노트를 고쳐야 하는데, **그건 하지 않는다** — 이 저장소의 주장 자체가
# "기록이 곧 증거"이고, 지도가 지저분하다고 그날 실제로 한 말을 지우면 증거가 거짓이 된다.
#
# 대신 이 파일이 지도 위에 얇게 덮인다:
#   hidden   그래프에서 뺀다 (노트·원장은 그대로. 언제든 이 줄만 지우면 되돌아온다)
#   renamed  같은 것으로 합친다 (별칭이라 다음 세션에 옛 이름으로 또 적어도 계속 합쳐진다)
#
# 채우는 법: **손으로 안 적어도 된다.** Topdown 지식 그래프에서 노드를 골라 "감추기"나
# "이름 바꾸기"를 누르면 `[설정]` Issue가 열리고 CI가 이 파일을 쓴다. 손으로 고쳐도 된다.
#
# 비어 있으면 아무것도 하지 않는다(안전 기본값).

# 그래프에서 감출 개념 이름 — 노트에 적힌 그대로 쓴다.
hidden: []
  # - 오늘 한 것
  # - TODO

# 이름 합치기. from에 적힌 이름은 to로 바뀌고, 둘 다 있으면 하나로 병합된다
# (상태·증거·선수관계가 to 쪽으로 합쳐진다).
renamed: []
