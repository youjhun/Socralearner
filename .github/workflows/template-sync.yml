name: template-sync

# 템플릿 업데이트 받아오기 — 주 1회 확인하고 **바로 적용한다.**
#
# 이 파일은 일부러 **얇다.** 로직은 전부 `scripts/template_sync_ci.py`에 있다.
#
# 왜: Actions의 기본 토큰은 `.github/workflows/` 아래를 수정할 수 없다(푸시 거부).
# 그래서 워크플로 안에 로직을 적어 두면, 그 로직을 고칠 때마다 자동 배포가 끊기고
# 쓰는 사람마다 손으로 파일을 복사해야 한다. 로직을 scripts/로 내려 두면 그쪽은
# 자유롭게 동기화되므로 **앞으로 고치는 것은 전부 자동으로 퍼진다.**
# 이 파일은 일정·권한이 바뀔 때만 손대면 되고, 그런 일은 드물다.
#
# 남는 수동 작업은 GPT 지침 재붙여넣기 하나뿐이다 — ChatGPT Custom GPT의 Instructions는
# API로 접근할 수 없어 어떤 방법으로도 자동화되지 않는다. 그것만 Issue로 알린다.
#
# 경계: 가져오는 것은 엔진(scripts · runner · presets · templates · 문서)뿐이다.
# 내 기록과 설정(daily · materials · papers · mastery · STATUS · drills · concepts.json ·
# topics.yaml · README)은 어느 경우에도 건드리지 않는다 — 목록은 sync_from_template.py에 있고,
# 그 약속은 적용 **전에** 테스트가 검사한다.

on:
  schedule:
    # 매주 월요일 09:20 KST (UTC 00:20). paper-scan(08:10 KST) 뒤에 둬서 겹치지 않게.
    - cron: "20 0 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: template-sync
  cancel-in-progress: false

jobs:
  sync:
    # 템플릿 저장소 자신에서는 돌 필요가 없다(자기와 동기화하는 꼴).
    if: github.repository != 'youjhun/Socralearner'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # PAT이 있으면 그것으로 체크아웃해야 뒤의 푸시도 같은 토큰으로 나간다.
          token: ${{ secrets.TEMPLATE_SYNC_TOKEN || github.token }}

      - name: 내 기록을 덮지 않는지 먼저 검사
        run: python3 scripts/test_sync_from_template.py

      - name: 동기화
        env:
          GH_TOKEN: ${{ secrets.TEMPLATE_SYNC_TOKEN || github.token }}
          HAS_PAT: ${{ secrets.TEMPLATE_SYNC_TOKEN != '' }}
          SYNC_MODE: ${{ vars.TEMPLATE_SYNC_MODE || 'auto' }}
        run: |
          export SYNC_DATE="$(TZ=Asia/Seoul date +%F)"
          python3 scripts/template_sync_ci.py

      - name: 실패를 조용히 넘기지 않는다
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci_notify_failure.py "템플릿 업데이트"
