name: template-sync

# 템플릿 업데이트 받아오기 — 주 1회 확인하고 **바로 적용한다.**
#
# 이 파일이 **쓰는 사람이 설치할 유일한 파일**이다. 로직은 템플릿에서 받아 온 것을
# 그대로 실행한다(`/tmp/tpl/scripts/...`).
#
# 왜 받아온 쪽을 실행하나: 로직을 저장소 안에 두면, 그 로직이 낡았을 때 **동기화 자체가
# 실패해서 새 로직을 받지 못한다**(자기모순). 실제로 2026-08-03에 그 일이 났다 —
# 워크플로를 얇게 만들며 로직을 scripts/로 내렸는데 설치 목록을 안 고쳐 첫 실행이 죽었다.
# 받아온 것을 실행하면 동기화 로직은 언제나 최신이고, 설치는 이 파일 하나로 끝난다.
#
# 경계: 가져오는 것은 엔진(scripts · runner · presets · templates · 문서)뿐이다.
# 내 기록과 설정(daily · materials · papers · mastery · STATUS · drills · concepts.json ·
# topics.yaml · README)은 어느 경우에도 건드리지 않는다. 그 약속은 적용 **전에** 검사한다.
#
# 남는 수동 작업은 GPT 지침 재붙여넣기 하나뿐이다 — ChatGPT Custom GPT의 Instructions는
# API로 접근할 수 없어 어떤 방법으로도 자동화되지 않는다. 그것만 Issue로 알린다.

on:
  schedule:
    # 매일 09:20 KST (UTC 00:20). paper-scan(08:10 KST) 뒤에 둬서 겹치지 않게.
    #
    # 2026-08-04: 주 1회(월요일)였다. 그래서 템플릿을 고쳐도 학습자 repo는 **최대 7일**
    # 뒤에야 받았고, 그 사이 새 기능은 "왜 내 repo에선 안 되지"로만 보였다(`[자료]` Issue가
    # 도착지 없이 사라진 사고). 사람이 Actions에서 손으로 돌려야 하는 것은 자동화가 아니다.
    #
    # 진짜 지연을 없애는 것은 아래 cron이 아니라 **세션 끝의 디스패치**다 —
    # `learning-note-ingest`가 세션을 접고 나서 이 워크플로를 깨운다. 그래서 다음 세션은
    # 언제나 최신으로 시작한다. cron은 그 경로가 죽었을 때의 그물이다.
    - cron: "20 0 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: template-sync
  cancel-in-progress: false

jobs:
  sync:
    # 템플릿 저장소 자신에서는 돌 필요가 없다(자기와 동기화하는 꼴).
    if: github.repository != 'youjhun/Socralearner'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # PAT이 있으면 그것으로 체크아웃해야 뒤의 푸시도 같은 토큰으로 나간다.
          token: ${{ secrets.TEMPLATE_SYNC_TOKEN || github.token }}

      - name: 템플릿 내려받기
        run: |
          mkdir -p /tmp/tpl
          curl -fsSL https://codeload.github.com/youjhun/Socralearner/tar.gz/refs/heads/main \
            | tar xz -C /tmp/tpl --strip-components=1
          echo "받은 파일 $(find /tmp/tpl -type f | wc -l)개"

      - name: 내 기록을 덮지 않는지 먼저 검사
        run: python3 /tmp/tpl/scripts/test_sync_from_template.py

      - name: 동기화
        env:
          GH_TOKEN: ${{ secrets.TEMPLATE_SYNC_TOKEN || github.token }}
          HAS_PAT: ${{ secrets.TEMPLATE_SYNC_TOKEN != '' }}
          SYNC_MODE: ${{ vars.TEMPLATE_SYNC_MODE || 'auto' }}
        run: |
          export SYNC_DATE="$(TZ=Asia/Seoul date +%F)"
          python3 /tmp/tpl/scripts/template_sync_ci.py --from /tmp/tpl

      - name: 실패를 조용히 넘기지 않는다
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 /tmp/tpl/scripts/ci_notify_failure.py "템플릿 업데이트" || true
