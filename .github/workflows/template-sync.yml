name: template-sync

# 템플릿 업데이트 받아오기 — 주 1회 확인하고 **바로 적용한다.**
#
# 왜 자동 적용인가 (2026-08-03 재검토):
# 처음에는 PR을 열어 두고 본인이 머지하게 했다. 그런데 그 리뷰는 실제로는 작동하지
# 않는다 — 쓰는 사람이 `build_concepts.py` diff를 읽고 판단할 수 있을 리 없다.
# 읽지 않을 리뷰를 위해 마찰만 만드는 셈이고, 마찰이 있으면 결국 아무도 안 받는다.
# 그래서 기본은 자동 적용이고, **적용한 뒤 무엇이 바뀌었는지 Issue로 알린다.**
# 리뷰를 원하면 저장소 변수 TEMPLATE_SYNC_MODE=pr 로 바꾸면 PR을 연다.
#
# 안전장치는 리뷰가 아니라 **범위 제한과 테스트**다:
#   · 가져오는 것은 엔진(scripts · runner · presets · templates · workflows · 문서)뿐.
#   · 내 기록(daily · materials · papers · mastery · STATUS · drills · concepts.json ·
#     topics.yaml · README)은 어느 경우에도 건드리지 않는다.
#   · 그 약속을 scripts/test_sync_from_template.py가 **적용 전에** 매번 검사한다.
#   · 파일을 지우지 않는다.
#
# 워크플로 파일의 제약:
# Actions의 기본 토큰(GITHUB_TOKEN)은 `.github/workflows/` 아래를 **수정할 수 없다**
# (푸시가 거부된다). 워크플로도 동기화 대상이라 이걸 모르면 워크플로가 바뀌는 순간
# 동기화 전체가 실패한다. 그래서 기본 토큰일 때는 워크플로를 건너뛰고 Issue로 알린다.
# `workflow` 스코프를 가진 PAT을 시크릿 TEMPLATE_SYNC_TOKEN 에 넣어 두면 그것까지 자동이다.

on:
  schedule:
    # 매주 월요일 09:20 KST (UTC 00:20). paper-scan(08:10 KST)보다 뒤에 둬서
    # 같은 시각에 두 워크플로가 같은 브랜치를 밀지 않게 한다.
    - cron: "20 0 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: template-sync
  cancel-in-progress: false

jobs:
  sync:
    # 템플릿 저장소 자신에서는 돌 필요가 없다(자기와 동기화하는 꼴).
    if: github.repository != 'youjhun/Socralearner'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # PAT이 있으면 그걸로 체크아웃해야 뒤의 푸시도 그 토큰으로 나간다.
          token: ${{ secrets.TEMPLATE_SYNC_TOKEN || github.token }}

      - name: 경로 정책 자체 점검 (내 기록을 덮지 않는지)
        run: python3 scripts/test_sync_from_template.py

      - name: 템플릿 내려받기
        run: |
          mkdir -p /tmp/tpl
          curl -fsSL https://codeload.github.com/youjhun/Socralearner/tar.gz/refs/heads/main \
            | tar xz -C /tmp/tpl --strip-components=1
          echo "받은 파일 $(find /tmp/tpl -type f | wc -l)개"

      - name: 바뀐 것 가져오기
        id: sync
        run: |
          # PAT이 없으면 워크플로 파일은 손대지 않는다 — 어차피 푸시가 거부된다.
          SKIP=""
          if [ -z "${{ secrets.TEMPLATE_SYNC_TOKEN }}" ]; then SKIP="--skip-workflows"; fi
          python3 scripts/sync_from_template.py --from /tmp/tpl $SKIP

      - name: 적용 (기본) 또는 PR (TEMPLATE_SYNC_MODE=pr)
        if: steps.sync.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.TEMPLATE_SYNC_TOKEN || github.token }}
          MODE: ${{ vars.TEMPLATE_SYNC_MODE || 'auto' }}
        run: |
          set -euo pipefail
          git config user.name  "socralearner[bot]"
          git config user.email "noreply@github.com"
          MSG="템플릿 업데이트 — ${{ steps.sync.outputs.summary }}"

          if [ "$MODE" = "pr" ]; then
            BRANCH="template-sync/$(date -u +%Y-%m-%d)"
            git checkout -B "$BRANCH"
            git add -A && git commit -m "$MSG"
            git push -f origin "$BRANCH"
            gh pr view "$BRANCH" --json number >/dev/null 2>&1 \
              || gh pr create --title "$MSG" --head "$BRANCH" \
                   --body "템플릿 업데이트입니다. 바뀐 것은 CHANGELOG.md를 보세요.
          내 기록(daily · materials · papers · mastery · STATUS · drills · concepts.json ·
          topics.yaml · README)은 건드리지 않았습니다."
            exit 0
          fi

          # 기본: 바로 적용한다.
          git add -A && git commit -m "$MSG"
          for i in 1 2 3 4; do
            git pull --rebase origin "${GITHUB_REF_NAME}" \
              && git push origin "HEAD:${GITHUB_REF_NAME}" && break
            sleep $((2 ** i))
          done

      - name: 무엇이 바뀌었는지 알린다
        if: steps.sync.outputs.changed == 'true' || steps.sync.outputs.workflow_count != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const summary = `${{ steps.sync.outputs.summary }}` || '변경 없음';
            const wfCount = `${{ steps.sync.outputs.workflow_count }}`;
            const wfFiles = `${{ steps.sync.outputs.workflow_files }}`.trim();
            const mode = `${{ vars.TEMPLATE_SYNC_MODE || 'auto' }}`;

            // 무엇이 왜 바뀌었는지는 템플릿의 CHANGELOG가 말한다.
            let notes = '';
            try {
              const md = fs.readFileSync('/tmp/tpl/CHANGELOG.md', 'utf8');
              notes = md.split('\n').slice(0, 70).join('\n');
            } catch { /* 없으면 생략 */ }

            const parts = [
              mode === 'pr'
                ? `템플릿 업데이트로 **PR을 열었습니다** — ${summary}`
                : `템플릿 업데이트를 **적용했습니다** — ${summary}`,
              '',
              '내 기록(`daily/` · `materials/` · `papers/` · `mastery.md` · `STATUS.md` ·',
              '`drills.md` · `concepts.json` · `topics.yaml` · `README.md`)은 건드리지 않았습니다.',
              '',
            ];

            if (wfCount !== '0' && wfFiles) {
              parts.push(
                '## ⚠️ 워크플로 파일은 손으로 바꿔야 합니다',
                '',
                'GitHub Actions의 기본 토큰은 `.github/workflows/` 를 수정할 수 없습니다.',
                '아래 파일을 템플릿에서 복사해 덮어써 주세요:',
                '',
                ...wfFiles.split(/\s+/).map((f) =>
                  `- [\`${f}\`](https://github.com/youjhun/Socralearner/blob/main/${f})`),
                '',
                '매번 손으로 하기 싫으면 — `workflow` 스코프를 가진 토큰을 만들어',
                '이 저장소 **Settings → Secrets → Actions** 에 `TEMPLATE_SYNC_TOKEN` 으로',
                '넣어 두면 이것까지 자동으로 처리됩니다.',
                '',
              );
            }

            parts.push('## 무엇이 바뀌었나', '', notes, '',
              '<sub>매주 월요일에 자동 확인합니다. 적용 대신 PR로 받고 싶으면 저장소 변수',
              '`TEMPLATE_SYNC_MODE` 를 `pr` 로 두세요. 그만 받으려면 Actions 탭에서',
              '이 워크플로를 비활성화하면 됩니다.</sub>');

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[템플릿] ${new Date().toISOString().slice(0, 10)} 업데이트 — ${summary}`,
              body: parts.join('\n').slice(0, 60000),
            });

      - name: 실패를 조용히 넘기지 않는다
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[템플릿] 업데이트 확인 실패 — ${new Date().toISOString().slice(0, 10)}`,
              body: `템플릿 동기화가 실패했습니다 — [실행 로그](${url})\n\n` +
                    `흔한 원인:\n` +
                    `- 기본 브랜치가 보호돼 있어 봇이 밀 수 없음 → 보호 규칙에서 Actions를 허용하거나 ` +
                    `저장소 변수 \`TEMPLATE_SYNC_MODE=pr\` 로 두세요.\n` +
                    `- PR 모드인데 **Settings → Actions → General → ` +
                    `"Allow GitHub Actions to create and approve pull requests"** 가 꺼져 있음.\n\n` +
                    `고친 뒤 Actions 탭에서 **template-sync → Run workflow** 로 다시 돌리면 됩니다.`,
            });
