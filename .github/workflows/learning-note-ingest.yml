name: learning-note-ingest

# 학습 세션 기록의 쓰기 경로 — Issue(평문) → CI → `daily/`.
#
# 배경: 러너(ChatGPT Custom GPT)가 Contents API로 직접 커밋하던 경로는 본문 전체를
# base64 한 덩어리로 요구해서, 노트가 길어지면 커밋이 실패했다. 러너는 살아남는 길이인
# "3줄 요약"으로 스스로 줄였고, 배운 것이 repo에 반영되지 않았다(2026-08-01 병목 보고).
# 그래서 모델은 평문만 쓰고(길면 코멘트로 이어서), 파일은 이 CI가 결정론적으로 만든다.
# `mastery-consolidate`와 같은 계열 — 큰 쓰기를 모델에서 CI로 옮긴다. LLM 토큰 0.
#
# 경계: 이 워크플로가 쓰는 경로는 `daily/**` · `materials/**` · `papers/**` · `STATUS.md` · `**/mastery*` · `drills.md` · `concepts.json` · `topics.yaml` · `tracks.yaml` 뿐이다.
# (`topics.yaml`은 2026-08-04에 들어왔다 — 러너가 `[설정]` Issue로 연구 주제를 갱신한다.
#  사람이 YAML을 손으로 쓰지 않게 하려는 것이고, 쓰는 것은 여전히 CI다.)
# 지금까지 러너의 PAT이 main에 직접 쓰던 바로 그 범위이므로 새 권한이 아니다 —
# 신뢰할 수 없는 작성자를 신뢰할 수 있는 작성자로 바꾼 것뿐이다(헌법 13조 경계 불변).
on:
  issues:
    # `opened`가 없으면 사람이 손으로 Run workflow를 눌러야 한다 — 자동화가 아니다
    # (유지훈 2026-08-01: "이슈가 만들어져도 자동으로 CI가 액션을 실행하지 않음").
    # 러너의 close 호출은 실패할 수 있으므로 **생성 시점**이 1차 트리거다.
    types: [opened, edited, closed]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue:
        description: "다시 수집할 Issue 번호"
        required: true

permissions:
  contents: write
  issues: write
  actions: write  # 세션 끝에 template-sync를 깨우기 위해서만 쓴다(아래 마지막 스텝)

concurrency:
  group: learning-note-ingest-${{ github.event.issue.number || github.event.inputs.issue }}

jobs:
  ingest:
    # 게이트: 제목이 `[학습]`·`[자료]`(증류된 강의자료)·`[논문]`(논문 읽기 세션)·`[설정]`(연구 주제)으로
    # 시작하는 Issue. 아래 `PREFIXES`도 같은 목록이어야 한다 — 한쪽만 열면 잡이 돌다가 실패한다.
    # `[논문]`은 2026-08-04에 열었다 — 그전까지 논문 러너의 Issue는 워크플로가 아예 돌지
    # 않아 조용히 사라졌다(템플릿만 쓰는 사용자에게는 논문 트랙 전체가 기록되지 않았다).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      ((startsWith(github.event.issue.title, '[학습]') || startsWith(github.event.issue.title, '[자료]') || startsWith(github.event.issue.title, '[논문]') || startsWith(github.event.issue.title, '[설정]')) &&
       (github.event_name == 'issues' ||
        startsWith(github.event.comment.body, '/기록')))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Issue 본문 + 코멘트 회수
        id: fetch
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const number = Number(context.payload.issue?.number || context.payload.inputs?.issue);
            const { data: issue } = await github.rest.issues.get(
              { owner: context.repo.owner, repo: context.repo.repo, issue_number: number });
            const PREFIXES = ['[학습]', '[자료]', '[논문]', '[설정]'];
            if (!PREFIXES.some(p => issue.title.startsWith(p))) {
              core.setFailed(`제목이 ${PREFIXES.join('/')}로 시작하지 않는다: ${issue.title}`);
              return;
            }
            const comments = await github.paginate(github.rest.issues.listComments,
              { owner: context.repo.owner, repo: context.repo.repo, issue_number: number, per_page: 100 });
            fs.writeFileSync('/tmp/payload.json', JSON.stringify({
              number,
              title: issue.title,
              body: issue.body || '',
              html_url: issue.html_url,
              comments: comments.map(c => ({ author: c.user?.login || '', body: c.body || '' })),
            }));
            core.setOutput('number', String(number));
            core.info(`수집: 코멘트 ${comments.length}개`);

      - name: 노트 생성 + STATUS 패치 적용
        id: ingest
        run: |
          python3 scripts/ingest_learning_note.py \
            --payload /tmp/payload.json \
            --today "$(TZ=Asia/Seoul date +%F)" \
            --report /tmp/report.md

      - name: 이해도 원장 통합
        # GITHUB_TOKEN 푸시는 mastery-consolidate.yml을 깨우지 못한다 — 여기서 직접 접는다.
        run: python3 scripts/consolidate_mastery.py


      - name: 개념 지도 빌드 (mastery + 개념 지도 → concepts.json)
        # Topdown 앱이 이 파일을 읽어 개념 그래프·막힌 길목을 보여준다.
        run: python3 scripts/build_concepts.py || echo "개념 지도 생성 실패(무시) — 노트 기록은 계속한다"

      - name: 커밋
        id: commit
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "변경 없음"; exit 0
          fi
          git config user.name  "socralearner[bot]"
          git config user.email "noreply@github.com"
          git add -A daily materials papers STATUS.md mastery.md drills.md concepts.json topics.yaml tracks.yaml 2>/dev/null || git add -A
          git commit -m "learning: 세션 노트 수집 (Issue #${{ steps.fetch.outputs.number }})"
          for i in 1 2 3 4; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((2 ** i))
          done
          exit 1

      - name: 결과를 Issue에 회신 (성공)
        if: success()
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const number = Number('${{ steps.fetch.outputs.number }}');
            const body = fs.existsSync('/tmp/report.md')
              ? fs.readFileSync('/tmp/report.md', 'utf8')
              : '기록할 변경이 없었다.';
            await github.rest.issues.createComment(
              { owner: context.repo.owner, repo: context.repo.repo, issue_number: number, body });
            // 생성 직후 수집은 **닫지 않는다** — 노트가 길어 코멘트로 이어 쓰는 중일 수 있다.
            // 그 코멘트(`/기록`)나 러너의 close가 오면 같은 파일을 덮어쓰며 다시 접힌다.
            if (context.payload.action === 'opened') {
              core.info('생성 트리거 — 이어쓸 수 있으므로 Issue를 열어 둔다.');
            } else if (context.payload.issue?.state === 'open') {
              await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo,
                issue_number: number, state: 'closed' });
            }

      - name: 템플릿 업데이트 확인 (세션이 끝난 뒤 — 다음 세션은 최신으로 시작한다)
        # 왜 여기인가: 템플릿이 고쳐져도 학습자 repo가 그것을 받는 시점이 cron뿐이면
        # 최대 하루가 뜬다. 그리고 **관측 가능한 사건**은 "세션이 끝났다"이다 —
        # 기록을 세션 시작에 걸었던 것과 같은 이유로, 동기화는 세션 끝에 건다.
        #
        # 반드시 커밋 스텝 **뒤**여야 한다. 앞에 두면 동기화의 푸시와 이 워크플로의
        # 푸시가 같은 main을 두고 경합한다. 뒤에 두면 순서가 서로 어긋나지 않는다.
        # 실패해도 세션 기록은 이미 끝났으므로 무시한다(`|| true`) — 동기화 실패로
        # 학습 기록이 실패한 것처럼 보이면 안 된다.
        if: always() && github.repository != 'youjhun/Socralearner'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run template-sync.yml || true

      - name: 실패를 Issue에 회신 (조용한 실패 금지)
        if: failure()
        uses: actions/github-script@v8
        with:
          script: |
            const number = Number('${{ steps.fetch.outputs.number }}' || context.payload.issue?.number);
            if (!number) return;
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo,
              issue_number: number,
              body: `❌ 학습 노트 수집 실패 — [실행 로그](${url})\n\n` +
                    `Issue는 열어 둔다. 고친 뒤 \`/기록\` 코멘트로 다시 시도하면 같은 파일에 덮어쓴다.` });
            await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo,
              issue_number: number, state: 'open' });

