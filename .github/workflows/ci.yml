name: ci
# 파이썬 검사 — 이 저장소의 스크립트가 파일럿 측정의 정본이다.
#
# 왜 이제야 (2026-08-15 감사 F-7): `pilot-report.yml`이 참가자 저장소에서 돌 때
# `test_pilot_rollup.py` 하나만 실행했다. 나머지(인제스터·관문 판정기·지침 계약)는
# **유지훈이 로컬에서 기억해서 돌릴 때만** 검증됐다. 측정 도구가 조용히 깨지면
# 관찰 4주가 통째로 무효가 되는데, 그 위험을 사람의 기억에 걸어 둔 셈이었다.
#
# 의존성 설치가 없다 — 이 저장소의 스크립트는 표준 라이브러리만 쓴다(그것이 규칙이다).
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 하나씩 돌린다 — 어느 것이 깨졌는지 로그를 열지 않고 알 수 있다.
      - run: python3 scripts/test_build_concepts.py
      - run: python3 scripts/test_ingest_learning_note.py
      - run: python3 scripts/test_pilot_rollup.py
      - run: python3 scripts/test_pilot_gates.py
      - run: python3 scripts/test_runner_instructions.py
      - run: python3 scripts/test_scan_papers.py
      - run: python3 scripts/test_sync_from_template.py
