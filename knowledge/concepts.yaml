# 개념 레지스트리 — 빈 견본 (SSOT는 이 파일이 채워졌을 때만)
#
# 이 파일은 **비어 있는 채로 시작한다.** 아래 `concepts:`가 비어 있는 동안은 아무 일도
# 일어나지 않는다 — 빌더는 지금까지처럼 `mastery.md` + daily의 `## 개념 지도`로 그래프를
# 짓는다(노트 모드). 항목을 하나라도 채우면 그때부터 이 파일이 그래프의 SSOT가 된다.
#
#   빌드:  python3 scripts/build_concepts.py       (→ concepts.json, Topdown이 읽는다)
#   검증:  python3 scripts/check_concept_ledger.py (레지스트리 ↔ mastery.md 드리프트)
#
# ## 언제 이걸 쓰나
#
# 선수관계는 세션이 `## 개념 지도`를 남긴 만큼만 쌓인다. 그 관례가 생기기 전에 쓴 노트로
# 배운 개념은 **영원히 간선 0**이고, 그러면 이 시스템의 핵심인 **막힌 길목**이 계산되지
# 않는다. 이미 쌓인 노트가 많은데 그래프가 비어 보인다면, 여기에 개념을 한 번 적어
# 그 공백을 메우고 이후 세션이 그 위에 쌓게 한다.
#
# **내용을 담지 않는다.** 개념의 정체(도메인·선수관계·외부 문서)와, 그 개념에 대해 실제로
# 배운 내용이 원본 노트 **어디에** 있는지(앵커)만 담는다. 본문은 빌드할 때 원본에서 그대로
# 꺼낸다 — 요약본을 만들지 않는다는 뜻이다.
#
# ## 필드
#
# id          큐레이션된 개념 id. slugify로 덮지 않는다(Hunwiki graph.json이 같은 id를 쓴다).
# label       화면에 보이는 이름.
# domain      분야. `subjects.yaml`의 별칭 표로 정규화된다.
# state       미학습 | 기록됨 | 암기 | 보완필요 | 설명중 | 설명가능
#             **판정의 SSOT는 이해도 원장(mastery.md)이다.** 여기 적는 것은 옮겨 적은 사본이고,
#             어긋나면 `check_concept_ledger.py`가 잡는다.
# importance  H | M | L
# verified    최근 재설명 검증일 (YYYY-MM-DD).
# mastery     이해도 원장의 **행 이름 목록**. 원장은 상태가 아니라 변화를 쌓으므로 한 개념에
#             여러 행이 붙는다. 있으면 state·중요도·검증일은 **가장 늦게 검증된 행**이 이긴다.
#             없으면 원장 밖 개념 — 노트에 남아 있으나 최근 검증이 없다는 뜻의 `기록됨`.
# prereq      선수 개념 id 목록. 이것이 **막힌 길목**을 만드는 화살표다.
# related     곁가지 개념 id 목록(선수관계는 아님).
# sources     file + match. `match`는 **원문에 그대로 있는 짧은 문자열**이고, 빌드가 그 자리의
#             원문 블록을 통째로 꺼낸다(목록 항목이면 그 항목, 아니면 문단 전체).
#             kind: 지식 | 내말 | 교정 | 계산 | 취약   (`내말`은 학습자 자신의 설명·예측)
# note        한 줄 메모. 없으면 원장의 검증 칸이 대신 들어간다.
# wikipedia   ko/en 문서 제목.
# open_questions  아직 안 풀린 질문들.
#
# ## 적는 법 (이 모양 그대로 `concepts:` 아래에 붙인다)
#
# - id: matrix-vector-map
#   label: 행렬-벡터 곱 = 선형변환
#   domain: linear-algebra
#   state: 설명가능
#   importance: H
#   verified: '2026-07-22'
#   mastery:
#   - 행렬-벡터 곱 = 선형변환
#   prereq:
#   - vector-space
#   related:
#   - column-space
#   note: 열벡터들의 가중결합으로 해석하는 데까지는 갔으나 입출력 차원 구분은 별도 노드로 남았다.
#   wikipedia:
#     en:
#     - Linear map
#     ko:
#     - 선형 변환
#   sources:
#   - file: daily/2026-07-19-covariance-spatial-filtering.md
#     kind: 지식
#     match: 행렬-벡터 곱은 입력 벡터를

