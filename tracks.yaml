# 학습 트랙 — 세션을 담는 서랍 (선택)
#
# 전자공학과 영어를 같이 공부하면 `daily/`에 둘이 섞여 쌓입니다. 그러면 러너가 세션
# 시작에 읽는 맥락도 섞이고("지금 뭘 공부하는 중이지?"), 개념 지도도 서로 무관한 두
# 주제가 한 그래프에 들어갑니다.
#
# 트랙을 만들면 세션 노트가 `daily/<id>/`로 갈라집니다. 러너는 세션 시작에
# **"오늘은 어느 트랙?"** 을 묻고, 그 트랙의 최근 세션만 읽습니다.
#
# 쓰는 법: **손으로 쓰지 않아도 됩니다.** 러너에게 "트랙 나눠줘"라고 하면 `[설정]`
# Issue로 넘기고 CI가 이 파일을 씁니다. Topdown 앱의 설정에서도 만들 수 있습니다.
#
#   id    — 폴더 이름이 됩니다. 영문 소문자-하이픈(한글은 경로에서 깨집니다).
#   label — 사람이 보는 이름. 러너에게는 이 이름으로 말해도 됩니다.
#   mode  — 진도 / 복원 / 논문 / 시험 (러너가 대본을 고르는 데 씁니다)
#   goal  — 끝나면 무엇을 스스로 설명·수행할 수 있나 (한 줄)
#
# 비어 있으면 지금까지처럼 `daily/` 한 폴더에 그대로 쌓입니다(안전 기본값).

tracks: []

