# 분야(subject) — 지식 그래프에서 **개념을 묶어 보는 라벨**
#
# 그래프에서 색이 분야다. 분야가 없으면 그래프가 단색이 되어 "내 지식이 어디에
# 뭉쳐 있고 어디가 비었나"가 안 보인다.
#
# ⚠️ 분야는 **라벨이지 학습 순서가 아니다.**
#    한 분야를 다 끝내고 다음으로 넘어가는 것이 아니다. 목표(논문·문제·프로젝트)에서
#    필요한 개념을 역산해 파고들면 그 개념들은 당연히 분야를 가로지른다 — 선형대수를
#    다 배워야 신호처리를 시작하는 것이 아니라, 실제 문제에서 둘이 어떻게 함께 쓰이는지가
#    학습의 단위다. 분야는 그렇게 배운 것을 **나중에 묶어 보는 축**일 뿐이다.
#
# 층위를 일정하게 유지하는 것이 이 파일의 전부다.
# 세션마다 그날 다룬 소주제를 분야로 올리면 같은 것이 여러 조각으로 쪼개진다
# (예: "회로 등가화"와 "회로 기초"가 서로 다른 분야가 되어 색이 갈린다).
#
# 판별: **이번 세션에서만 쓸 이름인가, 여러 달 뒤에도 같은 뜻으로 쓸 이름인가?**
# 후자만 분야다. 전자는 그 분야 안의 주제이므로 개념 지도의 소제목이 아니라
# 개념 이름으로 들어가야 한다.
#
# 채우는 법: 러너에게 "내 분야 정리해줘"라고 하면 지금까지의 노트를 보고 제안한다.
# 손으로 적어도 된다. 비어 있으면 정규화를 하지 않는다(안전 기본값 — 아무것도 안 바꾼다).

subjects: []

  # 예시 — 지우고 내 것으로 바꾼다. 이건 기본값이 아니라 **형식 견본**이다.
  # 이름과 층위는 학습자마다 다르다(전공 과목일 수도, 연구 주제일 수도, 자격증 과목일 수도).
  #
  # - name: <분야 이름 — 여러 달 뒤에도 같은 뜻으로 쓸 이름>
  #   aliases:            # 노트에 이렇게 적혀도 위 이름으로 합친다
  #     - <같은 것을 가리키는 다른 표기>
  #     - <그 분야 안의 소주제로 잘못 올라온 이름>
